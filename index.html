<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2448a5">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Simulado COSIF BACEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,500&display=swap">
<style>
/* Layout: boas-vindas em tela cheia; seleção em duas colunas (blocos | aleatório); prova com caderno + cartão-resposta lateral; no celular tudo em coluna única */
:root {
  --bg: #f2f4f8;
  --surface: #ffffff;
  --ink: #1a2233;
  --muted: #5b6578;
  --line: #dce1ea;
  --accent: #2448a5;
  --accent-soft: rgba(36, 72, 165, 0.08);
  --on-accent: #ffffff;
  --ok: #1f8a4c;
  --ok-soft: rgba(31, 138, 76, 0.10);
  --bad: #c4372b;
  --bad-soft: rgba(196, 55, 43, 0.09);
  --warn: #b86f00;
  --warn-soft: rgba(184, 111, 0, 0.10);
  --paper: #fbfaf7;
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-text: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e121a; --surface: #161b26; --ink: #e5e8ef; --muted: #98a1b4; --line: #293041;
    --accent: #7d9bff; --accent-soft: rgba(125, 155, 255, 0.14); --on-accent: #0e121a;
    --ok: #4cc283; --ok-soft: rgba(76, 194, 131, 0.13); --bad: #f07468; --bad-soft: rgba(240, 116, 104, 0.13);
    --warn: #f0b44c; --warn-soft: rgba(240, 180, 76, 0.13); --paper: #1a2030; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e121a; --surface: #161b26; --ink: #e5e8ef; --muted: #98a1b4; --line: #293041;
  --accent: #7d9bff; --accent-soft: rgba(125, 155, 255, 0.14); --on-accent: #0e121a;
  --ok: #4cc283; --ok-soft: rgba(76, 194, 131, 0.13); --bad: #f07468; --bad-soft: rgba(240, 116, 104, 0.13);
  --warn: #f0b44c; --warn-soft: rgba(240, 180, 76, 0.13); --paper: #1a2030; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; -webkit-font-smoothing: antialiased; transition: background 0.2s; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
#root { min-height: 100%; display: flex; flex-direction: column; }
#root > * { flex: 1 0 auto; }
* { box-sizing: border-box; }
h1, h2, h3 { text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* ---------- Boas-vindas ---------- */
.welcome { display: flex; flex-direction: column; }
.welcome-top { display: flex; justify-content: space-between; align-items: center; padding-block: 14px; }
.marca { font-family: var(--font-num); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); }
.welcome-main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 26px; padding-block: 24px 64px; max-width: 900px; }
.frase { margin: 0; }
.frase p { margin: 0; font-family: var(--font-text); font-style: italic; font-weight: 500; font-size: clamp(52px, 12vw, 116px); line-height: 0.98; letter-spacing: -0.025em; color: var(--ink); }
.frase p .q { color: var(--accent); }
.frase footer { margin-top: 18px; font-size: 15px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.frase footer::before { content: ""; width: 28px; height: 1px; background: var(--muted); }
.welcome-sub { margin: 0; max-width: 46ch; font-size: 16px; line-height: 1.55; color: var(--muted); }
.welcome-sub b { color: var(--ink); font-weight: 600; }
.enter-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.dica { font-size: 13px; color: var(--muted); }
.dica kbd, .atalhos kbd { font-family: var(--font-num); font-size: 11px; padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--surface); color: var(--ink); }
.btn-enter { height: 52px !important; padding-inline: 34px !important; font-size: 17px !important; font-weight: 600 !important; }
@media (prefers-reduced-motion: no-preference) {
  .welcome-main > * { animation: sobe 0.6s cubic-bezier(.2,.7,.2,1) both; }
  .welcome-main > *:nth-child(2) { animation-delay: 0.05s; }
  .welcome-main > *:nth-child(3) { animation-delay: 0.12s; }
  .welcome-main > *:nth-child(4) { animation-delay: 0.18s; }
}
@keyframes sobe { from { transform: translateY(10px); } to { transform: none; } }

/* ---------- Seleção ---------- */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.appbar-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.appbar-title { display: grid; min-width: 0; }
.appbar-title strong { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar-right { display: flex; align-items: center; gap: 8px; flex: none; }
.selecao { padding-block: 22px 48px; display: grid; gap: 20px; }
.sel-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
.sel-grid > * { min-width: 0; }
.sel-side { display: grid; gap: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); }
.h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.sec-head { display: grid; gap: 4px; margin-bottom: 4px; }
.sec-head p { margin: 0; color: var(--muted); line-height: 1.5; }
.prova-resumo { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 13px; margin: 2px 0 14px; }
.prova-resumo b { color: var(--ink); font-family: var(--font-num); font-weight: 600; }
.blocos { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
.bloco { text-align: left; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 12px; display: grid; gap: 6px; cursor: pointer; color: var(--ink); font: inherit; transition: border-color 0.15s, transform 0.15s; }
.bloco:hover { border-color: var(--accent); }
.bloco:active { transform: scale(0.98); }
.bloco .t { font-weight: 600; font-size: 15px; }
.bloco .r { font-family: var(--font-num); font-size: 12px; color: var(--muted); }
.pill { justify-self: start; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); font-family: var(--font-num); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.mid { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.and { background: var(--accent-soft); color: var(--accent); }
.campo { display: grid; gap: 6px; }
.campo > label, .campo > .lbl { font-weight: 500; font-size: 14px; }
.campo small { color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.pool { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--bg); font-size: 13px; color: var(--muted); }
.pool b { font-family: var(--font-num); font-size: 18px; color: var(--ink); }
.opcao { display: flex; gap: 12px; align-items: flex-start; }
.opcao .t { display: grid; gap: 2px; min-width: 0; }
.opcao small { color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.retomar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 10px; }
.retomar .t { display: grid; gap: 2px; min-width: 0; }
.retomar .t span { color: var(--muted); font-size: 13px; }
.retomar .acoes { display: flex; gap: 8px; flex-wrap: wrap; }
.rodape { color: var(--muted); font-size: 12.5px; line-height: 1.5; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; border-top: 1px solid var(--line); padding-top: 14px; }

/* ---------- Barra da prova ---------- */
.timer { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); color: var(--ink); white-space: nowrap; }
.timer.livre { color: var(--muted); }
.timer.warn { color: var(--warn); border-color: var(--warn); }
.timer.crit { color: var(--bad); border-color: var(--bad); animation: pulso 1s ease-in-out infinite; }
@keyframes pulso { 50% { opacity: 0.55; } }
.barra { height: 3px; background: var(--line); }
.barra > i { display: block; height: 100%; background: var(--accent); transition: width 0.25s ease; }

/* ---------- Prova ---------- */
.prova-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; padding-block: 20px 40px; align-items: start; }
.prova-grid.mobile { grid-template-columns: minmax(0, 1fr); padding-block: 14px 110px; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); display: grid; gap: 14px; }
.q { display: grid; gap: 18px; }
.q-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.q-num { font-family: var(--font-num); font-weight: 600; font-size: 14px; }
.q-of { color: var(--muted); font-size: 13px; margin-left: 6px; }
.q-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.q-tags .ant-tag { margin-inline-end: 0; white-space: normal; height: auto; line-height: 1.5; }
.enunciado { margin: 0; font-family: var(--font-text); font-size: 17px; line-height: 1.6; max-width: 70ch; }
.itens { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.itens li { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
.item-txt { flex: 1; min-width: 0; display: flex; gap: 10px; font-family: var(--font-text); font-size: 16px; line-height: 1.55; }
.item-n { flex: none; font-family: var(--font-num); font-weight: 600; font-size: 13px; color: var(--muted); padding-top: 3px; }
.vf-tog { display: flex; gap: 4px; flex: none; }
.vf-b { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-family: var(--font-num); font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.vf-b:hover { border-color: var(--accent); }
.vf-b.on.V { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.vf-b.on.F { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.vf-hint { margin: -6px 0 0; font-size: 13px; color: var(--muted); }
.vf-hint b { font-family: var(--font-num); color: var(--ink); }
.alts { display: grid; gap: 10px; }
.alt { display: flex; gap: 12px; align-items: flex-start; padding: 12px 10px 12px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; transition: border-color 0.15s, background 0.15s; -webkit-tap-highlight-color: transparent; }
.alt:hover { border-color: var(--accent); }
.alt.sel { border-color: var(--accent); background: var(--accent-soft); }
.alt .letra { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; font-family: var(--font-num); font-weight: 600; font-size: 14px; color: var(--ink); }
.alt.sel .letra { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.alt .txt { flex: 1; min-width: 0; padding-top: 5px; font-family: var(--font-text); font-size: 16px; line-height: 1.5; }
.alt .txt.seq { font-family: var(--font-num); font-size: 15px; letter-spacing: 0.04em; }
.alt.riscada .txt { text-decoration: line-through; text-decoration-thickness: 1.5px; color: var(--muted); }
.alt.riscada .letra { opacity: 0.45; }
.alt .risc { flex: none; color: var(--muted); }
.alt.riscada .risc { color: var(--bad); }
.alt.rev { cursor: default; }
.alt.rev:hover { border-color: var(--line); }
.alt.correta, .alt.correta:hover { border-color: var(--ok); background: var(--ok-soft); }
.alt.correta .letra { background: var(--ok); border-color: var(--ok); color: var(--on-accent); }
.alt.errada, .alt.errada:hover { border-color: var(--bad); background: var(--bad-soft); }
.alt.errada .letra { background: var(--bad); border-color: var(--bad); color: var(--on-accent); }
.alt .marca-r { flex: none; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding-top: 8px; }
.alt.correta .marca-r { color: var(--ok); }
.alt.errada .marca-r { color: var(--bad); }
.q-tools { display: flex; flex-wrap: wrap; gap: 8px; }
.vf-b:disabled { cursor: default; }
.vf-b:disabled:hover { border-color: var(--line); }
.vf-b.on:disabled.V:hover { border-color: var(--ok); }
.vf-b.on:disabled.F:hover { border-color: var(--bad); }
.feedback-wrap { display: grid; gap: 10px; scroll-margin-bottom: 96px; scroll-margin-top: 90px; }
.feedback { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; font-size: 15px; line-height: 1.5; }
.feedback .anticon { font-size: 20px; flex: none; margin-top: 1px; }
.feedback.ok { background: var(--ok-soft); color: var(--ink); border: 1px solid var(--ok); }
.feedback.ok .anticon, .feedback.ok b { color: var(--ok); }
.feedback.bad { background: var(--bad-soft); color: var(--ink); border: 1px solid var(--bad); }
.feedback.bad .anticon, .feedback.bad b { color: var(--bad); }
.feedback .seqg { font-family: var(--font-num); font-weight: 600; }
.confirmar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 10px; }
.confirmar.pronto { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
.confirmar-dica { flex: 1; min-width: 180px; font-size: 13px; color: var(--muted); line-height: 1.45; }
.resumo b.ok { color: var(--ok); }
.resumo b.bad { color: var(--bad); }
.q-nav { display: flex; justify-content: space-between; gap: 10px; padding-top: 18px; margin-top: 4px; border-top: 1px solid var(--line); }
.atalhos { color: var(--muted); font-size: 12px; line-height: 1.8; }
.bottombar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.bottombar > :last-child { justify-self: end; }
.bottombar .meio { font-family: var(--font-num); font-size: 13px; color: var(--muted); text-align: center; }

/* ---------- Cartão-resposta ---------- */
.cartao { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.bolha { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; font-family: var(--font-num); padding: 0; transition: border-color 0.15s; }
.bolha:hover { border-color: var(--accent); }
.bolha .n { font-size: 13px; font-weight: 600; line-height: 1; }
.bolha .r { font-size: 11px; color: var(--muted); line-height: 1; }
.bolha.resp { background: var(--accent-soft); border-color: var(--accent); }
.bolha.resp .r { color: var(--accent); font-weight: 600; }
.bolha.atual { box-shadow: 0 0 0 2px var(--accent); }
.bolha.marc::after { content: ""; position: absolute; top: 4px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.bolha.certa { background: var(--ok-soft); border-color: var(--ok); }
.bolha.certa .r { color: var(--ok); font-weight: 600; }
.bolha.errada { background: var(--bad-soft); border-color: var(--bad); }
.bolha.errada .r { color: var(--bad); font-weight: 600; }
.bolha.branco { border-style: dashed; }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 12px; color: var(--muted); }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.legenda i { width: 10px; height: 10px; border-radius: 3px; border: 1px solid var(--line); display: inline-block; }
.legenda i.l-resp { background: var(--accent-soft); border-color: var(--accent); }
.legenda i.l-marc { border-radius: 50%; background: var(--warn); border-color: var(--warn); }
.legenda i.l-certa { background: var(--ok-soft); border-color: var(--ok); }
.legenda i.l-errada { background: var(--bad-soft); border-color: var(--bad); }
.legenda i.l-branco { border-style: dashed; border-color: var(--muted); }
.resumo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.resumo b { display: block; font-family: var(--font-num); font-size: 20px; font-variant-numeric: tabular-nums; }
.resumo small { color: var(--muted); font-size: 12px; }

/* ---------- Resultado ---------- */
.resultado { padding-block: 22px 56px; display: grid; gap: 20px; }
.placar { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; }
.placar .info { flex: 1; min-width: 240px; display: grid; gap: 14px; }
.placar h1 { margin: 0; font-size: clamp(22px, 4vw, 30px); line-height: 1.2; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stat { padding: 12px; border: 1px solid var(--line); border-radius: 10px; display: grid; gap: 2px; }
.stat small { color: var(--muted); font-size: 12px; }
.stat b { font-family: var(--font-num); font-size: 22px; font-variant-numeric: tabular-nums; }
.stat.ok b { color: var(--ok); } .stat.bad b { color: var(--bad); }
.res-acoes { display: flex; gap: 10px; flex-wrap: wrap; }
.duas { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.duas > * { min-width: 0; }
.tema-linha { display: flex; justify-content: space-between; gap: 12px; padding-block: 8px; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.4; }
.tema-linha:last-child { border-bottom: 0; }
.tema-linha span:last-child { flex: none; font-family: var(--font-num); color: var(--bad); font-weight: 600; }
.gab-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.gab-head .ant-segmented { max-width: 100%; overflow-x: auto; }
.gab-lista { display: grid; gap: 14px; }
.gab-item { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 20px); }
.coment { margin: 0; padding: 12px 14px; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); line-height: 1.6; font-size: 14.5px; }
.coment > b { display: block; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.coment ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.coment .vf-ok { color: var(--ok); font-weight: 600; font-family: var(--font-num); }
.coment .vf-no { color: var(--bad); font-weight: 600; font-family: var(--font-num); }
.coment p { margin: 0; }

@media (max-width: 900px) {
  .sel-grid, .duas { grid-template-columns: minmax(0, 1fr); }
  .sel-side { position: static; }
}
@media (max-width: 560px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .enunciado { font-size: 16.5px; }
  .appbar-title strong { font-size: 14px; }
  .itens li { flex-direction: column; gap: 10px; }
  .vf-tog { align-self: flex-end; }
  .blocos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

const cache = {};
function carregarProva(id) {
  if (!cache[id]) {
    cache[id] = fetch("data/prova" + id + ".json")
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(d => d.questoes.map(q => ({ ...q, id: "p" + id + "-" + q.n, prova: id })));
    cache[id].catch(() => { delete cache[id]; });
  }
  return cache[id];
}

/* ---------- Tema claro/escuro ---------- */
function useDark() {
  const get = () => { const t = document.documentElement.getAttribute("data-theme"); if (t) return t === "dark"; return window.matchMedia("(prefers-color-scheme: dark)").matches; };
  const [d, setD] = useState(get);
  useEffect(() => {
    const mq = window.matchMedia("(prefers-color-scheme: dark)"); const f = () => setD(get());
    mq.addEventListener("change", f);
    const mo = new MutationObserver(f); mo.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    return () => { mq.removeEventListener("change", f); mo.disconnect(); };
  }, []);
  return d;
}
function TemaBtn({ comTexto }) {
  const dark = useDark();
  const alternar = () => { const t = dark ? "light" : "dark"; document.documentElement.setAttribute("data-theme", t); try { localStorage.setItem(TKEY, t); } catch (e) {} };
  const rotulo = dark ? "Usar tema claro" : "Usar tema escuro";
  const btn = html`<${Button} onClick=${alternar} aria-label=${rotulo} icon=${dark ? html`<${SunOutlined} />` : html`<${MoonOutlined} />`}>${comTexto ? (dark ? "Tema claro" : "Tema escuro") : null}<//>`;
  return comTexto ? btn : html`<${Tooltip} title=${rotulo}>${btn}<//>`;
}

/* ---------- Correção ---------- */
function corrigir(s) {
  const status = {}; let ac = 0, er = 0, br = 0; const temasErro = {};
  s.questoes.forEach(q => {
    const r = s.respostas[q.id];
    if (!r) { status[q.id] = "branco"; br++; }
    else if (r === q.gabarito) { status[q.id] = "certa"; ac++; }
    else { status[q.id] = "errada"; er++; }
    if (status[q.id] !== "certa") temasErro[q.tema] = (temasErro[q.tema] || 0) + 1;
  });
  const total = s.questoes.length;
  return { status, ac, er, br, total, pct: Math.round((ac / total) * 100), temasErro: Object.entries(temasErro).sort((a, b) => b[1] - a[1]) };
}

function Timer({ s, onEnd }) {
  const [now, setNow] = useState(Date.now());
  const fim = useRef(false);
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);
  const livre = !s.fimEm;
  const rest = livre ? 0 : s.fimEm - now;
  useEffect(() => { if (!livre && rest <= 0 && !fim.current) { fim.current = true; onEnd(); } }, [rest <= 0]);
  if (livre) return html`<span className="timer livre" role="timer" aria-label="Tempo decorrido"><${ClockCircleOutlined} /> ${fmt(now - s.inicioEm)}</span>`;
  const cls = rest < 60000 ? "crit" : rest < 300000 ? "warn" : "";
  return html`<span className=${"timer " + cls} role="timer" aria-label="Tempo restante"><${ClockCircleOutlined} /> ${fmt(rest)}</span>`;
}

function Alt({ o, seq, sel, risc, onSel, onRisc, rev, marca }) {

        icon=${html`<${ScissorOutlined} />`}
        onClick=${e => { e.stopPropagation(); onRisc(); }} onKeyDown=${e => e.stopPropagation()} />
    <//>
  </div>`;
}

    if (!atual.includes(k) && respostas[q.id] === k) delete respostas[q.id];

    <p className="enunciado">${q.enunciado}</p>
    ${q.tipo === "vf" && html`<ol className="itens">
      ${q.itens.map((t, k) => html`<li key=${k}>
        <div className="item-txt"><span className="item-n">${k + 1}</span><span>${t}</span></div>

        </div>
      </li>`)}
    </ol>`}
    ${dicaVF}
    <div className="alts" role="radiogroup" aria-label=${"Alternativas da questão " + (idx + 1)}>

        : html`<${Alt} key=${o.k} o=${o} seq=${q.tipo === "vf"} sel=${resp === o.k} risc=${risc.includes(o.k)} onSel=${() => responder(o.k)} onRisc=${() => riscar(o.k)} />`)}
    </div>
    ${s.imediata && !travada && html`<div className=${"confirmar" + (resp ? " pronto" : "")}>
      <${Button} type="primary" size="large" icon=${html`<${CheckOutlined} />`} disabled=${!resp} onClick=${confirmar}>
        ${resp ? "Confirmar resposta " + resp : "Confirmar resposta"}
      <//>
      <span className="confirmar-dica">${resp
        ? "Confira sua escolha. Depois de confirmar, o gabarito aparece e não é possível trocar."
        : "Selecione uma alternativa e depois confirme para ver o gabarito."}</span>
    </div>`}
    ${travada && html`<div className="feedback-wrap" ref=${fbRef}>
      <div className=${"feedback " + (acertou ? "ok" : "bad")} role="status">
        ${acertou ? html`<${CheckCircleFilled} />` : html`<${CloseCircleFilled} />`}
        ${acertou
          ? html`<span><b>Você acertou.</b> A alternativa ${q.gabarito} é o gabarito.</span>`
          : html`<span><b>Resposta errada.</b> O gabarito é a alternativa ${q.gabarito}${q.tipo === "vf" ? " (" : ""}${q.tipo === "vf" && html`<span className="seqg">${q.alternativas[LETRAS.indexOf(q.gabarito)]}</span>`}${q.tipo === "vf" ? ")" : ""}.</span>`}
      </div>
      <div className="coment"><b>Comentário</b><${Comentario} texto=${q.comentario} /></div>
    </div>`}
    <div className="q-tools">
      <${Button} onClick=${marcar} icon=${marc ? html`<${FlagFilled} style=${{ color: "var(--warn)" }} />` : html`<${FlagOutlined} />`}>
        ${marc ? "Marcada para revisão" : "Marcar para revisão"}
      <//>
      ${resp && !travada && html`<${Button} type="text" icon=${html`<${UndoOutlined} />`} onClick=${() => responder(resp)}>Deixar em branco<//>`}
    </div>
  </div>`;
}

function Comentario({ texto }) {
  const partes = texto.split(/\s(?=\d\) [VF]\.)/);
  if (partes.length > 1 || /^\d\) [VF]\./.test(texto)) {
    return html`<ul>${partes.map((p, i) => {
      const m = p.match(/^(\d\)) ([VF])\.\s*(.*)$/);
      if (!m) return html`<li key=${i}>${p}</li>`;
      return html`<li key=${i}><span className=${m[2] === "V" ? "vf-ok" : "vf-no"}>Item ${m[1].replace(")", "")}: ${m[2] === "V" ? "Verdadeiro" : "Falso"}.</span> ${m[3]}</li>`;
    })}</ul>`;
  }
  return html`<p>${texto}</p>`;
}

function Selecao({ st, up, iniciar, desktop }) {
  const { modal } = AntApp.useApp();
  const [aba, setAba] = useState(String(st.ultimaProva || 1));
  const [fProvas, setFProvas] = useState(st.filtros?.provas || PROVAS.map(p => p.id));
  const [fTemas, setFTemas] = useState(st.filtros?.temas || []);
  const [qtd, setQtd] = useState(st.filtros?.qtd || TAM_BLOCO);
  const [carregando, setCarregando] = useState(null);
  const s = st.sessao;
  const emAndamento = s && !s.entregueEm;

  const pool = useMemo(() => fProvas.reduce((acc, p) => {
    const c = MANIFESTO.contagem[p];
    return acc + (fTemas.length ? fTemas.reduce((a, t) => a + (c[t] || 0), 0) : PROVAS.find(x => x.id === p).total);
  }, 0), [fProvas, fTemas]);

  const comConfirmacao = (titulo, conteudo, acao) => {
    modal.confirm({
      title: titulo,
      content: emAndamento ? html`<div style=${{ display: "grid", gap: 8 }}><span>${conteudo}</span><span style=${{ color: "var(--warn)" }}>Você tem um bloco em andamento (${s.titulo}). Começar outro descarta as respostas dele.</span></div>` : conteudo,
      okText: "Começar", cancelText: "Cancelar", onOk: acao
    });
  };

  const abrirBloco = (p, b) => {
    const ini = (b - 1) * TAM_BLOCO + 1, fim = Math.min(b * TAM_BLOCO, p.total);
    const h = st.historico[`p${p.id}-b${b}`];
    const n = fim - ini + 1;
    comConfirmacao(`Prova ${p.id} · Bloco ${b}`,
      `Questões ${ini} a ${fim} · ${n} questões${st.cronometro ? " · " + n * MIN_POR_Q + " minutos" : " · sem limite de tempo"}${st.correcaoImediata ? " · correção imediata" : ""}.` + (h ? ` Última tentativa: ${h.acertos}/${h.total}.` : ""),
      async () => {
        setCarregando("bloco");
        try {
          const qs = await carregarProva(p.id);
          up({ ultimaProva: p.id });
          iniciar({ chave: `p${p.id}-b${b}`, tipo: "bloco", prova: p.id, bloco: b, titulo: `Prova ${p.id} · Bloco ${b}`, questoes: qs.slice(ini - 1, fim) });
        } catch (e) { antd.message.error(`Não foi possível carregar a Prova ${p.id}. Verifique a conexão e tente de novo.`); }
        finally { setCarregando(null); }
      });
  };

  const sortear = () => {
    const n = Math.min(qtd, pool);
    comConfirmacao("Simulado aleatório",
      `${n} questões sorteadas de ${fProvas.length === PROVAS.length ? "todas as provas" : "Prova " + fProvas.slice().sort().join(", ")}${fTemas.length ? ", em " + fTemas.length + (fTemas.length === 1 ? " tema" : " temas") : ""}${st.cronometro ? " · " + n * MIN_POR_Q + " minutos" : ""}${st.correcaoImediata ? " · correção imediata" : ""}.`,
      async () => {
        setCarregando("rand");
        try {
          const listas = await Promise.all(fProvas.map(carregarProva));
          let todas = listas.flat();
          if (fTemas.length) todas = todas.filter(q => fTemas.includes(q.tema));
          const filtros = { provas: fProvas, temas: fTemas, qtd };
          up({ filtros });
          iniciar({ chave: "aleatorio", tipo: "aleatorio", titulo: "Simulado aleatório", filtros, questoes: embaralhar(todas).slice(0, qtd) });
        } catch (e) { antd.message.error("Não foi possível carregar as provas. Verifique a conexão e tente de novo."); }
        finally { setCarregando(null); }
      });
  };

  const limparHistorico = () => modal.confirm({
    title: "Limpar o histórico?", content: "As notas de todos os blocos concluídos serão apagadas deste navegador.",
    okText: "Limpar", okButtonProps: { danger: true }, cancelText: "Cancelar", onOk: () => up({ historico: {} })
  });

  const abaItens = PROVAS.map(p => {
    const nb = nBlocos(p);
    const feitos = Array.from({ length: nb }, (_, i) => st.historico[`p${p.id}-b${i + 1}`]).filter(Boolean);
    const media = feitos.length ? Math.round(feitos.reduce((a, h) => a + h.acertos, 0) / feitos.reduce((a, h) => a + h.total, 0) * 100) : null;
    return {
      key: String(p.id), label: `Prova ${p.id}`,
      children: html`<div>
        <div className="prova-resumo">
          <span><b>${p.total}</b> questões</span>
          <span><b>${nb}</b> blocos</span>
          <span><b>${feitos.length}</b> concluídos</span>
          ${media !== null && html`<span>média <b>${media}%</b></span>`}
        </div>
        <div className="blocos">
          ${Array.from({ length: nb }, (_, i) => {
            const b = i + 1, ini = i * TAM_BLOCO + 1, fim = Math.min(b * TAM_BLOCO, p.total);
            const h = st.historico[`p${p.id}-b${b}`];
            const andando = emAndamento && s.chave === `p${p.id}-b${b}`;
            const pct = h ? Math.round(h.acertos / h.total * 100) : 0;
            return html`<button key=${b} className="bloco" disabled=${!!carregando} onClick=${() => andando ? up({ tela: "prova" }) : abrirBloco(p, b)}
                aria-label=${`Bloco ${b}, questões ${ini} a ${fim}` + (h ? `, última nota ${h.acertos} de ${h.total}` : "") + (andando ? ", em andamento" : "")}>
              <span className="t">Bloco ${b}</span>
              <span className="r">${String(ini).padStart(3, "0")}–${String(fim).padStart(3, "0")}</span>
              ${andando ? html`<span className="pill and">em andamento</span>`
                : h ? html`<span className=${"pill " + faixa(pct)}>${h.acertos}/${h.total} · ${pct}%</span>`
                : html`<span className="pill">não feito</span>`}
            </button>`;
          })}
        </div>
      </div>`
    };
  });

  return html`<div>
    <${AppBar} eyebrow="Banco Central do Brasil" titulo="Simulado COSIF"><${TemaBtn} /><//>
    <main className="wrap selecao">
      ${emAndamento && html`<div className="retomar">
        <div className="t"><strong>${s.titulo} em andamento</strong>
          <span>${Object.keys(s.respostas).length} de ${s.questoes.length} respondidas${s.fimEm ? " · " + fmt(s.fimEm - Date.now()) + " restantes" : ""}</span></div>
        <div className="acoes">
          <${Button} type="primary" icon=${html`<${PlayCircleOutlined} />`} onClick=${() => up({ tela: "prova" })}>Continuar<//>
        </div>
      </div>`}

      <div className="sel-grid">
        <section>
          <${Card} styles=${{ body: { padding: desktop ? 24 : 16 } }}>
            <div className="sec-head">
              <h2 className="h2">Escolha a prova</h2>
              <p>Cada prova foi dividida em blocos de até ${TAM_BLOCO} questões, na ordem original.</p>
            </div>
            <${Tabs} activeKey=${aba} onChange=${k => setAba(k)} items=${abaItens} />
          <//>
        </section>

        <aside className="sel-side">
          <${Card} styles=${{ body: { padding: desktop ? 24 : 16, display: "grid", gap: 16 } }}>
            <div className="sec-head">
              <h2 className="h2">Simulado aleatório</h2>
              <p>Mistura as questões das provas escolhidas e sorteia um bloco novo a cada vez.</p>
            </div>
            <div className="campo">
              <span className="lbl" id="lbl-provas">Provas</span>
              <${Checkbox.Group} aria-labelledby="lbl-provas" value=${fProvas} onChange=${v => v.length && setFProvas(v)}
                options=${PROVAS.map(p => ({ label: "Prova " + p.id, value: p.id }))} />
            </div>
            <div className="campo">
              <label htmlFor="temas">Temas</label>
              <${Select} id="temas" mode="multiple" allowClear placeholder="Todos os temas" value=${fTemas} onChange=${setFTemas}
                maxTagCount="responsive" options=${TEMAS.map(t => ({ label: t, value: t }))} style=${{ width: "100%" }}
                optionFilterProp="label" />
            </div>
            <div className="campo">
              <span className="lbl">Quantidade</span>
              <${Segmented} block value=${qtd} onChange=${setQtd} options=${[{ label: "5", value: 5 }, { label: "10", value: 10 }, { label: "20", value: 20 }]} />
            </div>
            <div className="pool"><span>Questões disponíveis</span><b>${num(pool)}</b></div>
            <${Button} type="primary" size="large" block icon=${html`<${ThunderboltOutlined} />`} loading=${carregando === "rand"} disabled=${!pool || !!carregando} onClick=${sortear}>Sortear e começar<//>
          <//>

          <${Card} size="small" styles=${{ body: { display: "grid", gap: 16 } }}>
            <div className="opcao">
              <${Switch} id="imediata" checked=${st.correcaoImediata} onChange=${v => up({ correcaoImediata: v })} />
              <label className="t" htmlFor="imediata">
                <span>Correção imediata</span>
                <small>Você seleciona a alternativa, confirma e vê na hora se acertou, com o gabarito e o comentário. Desligada, a correção só aparece ao entregar o bloco.</small>
              </label>
            </div>
            <div className="opcao">
              <${Switch} id="crono" checked=${st.cronometro} onChange=${v => up({ cronometro: v })} />
              <label className="t" htmlFor="crono">
                <span>Cronômetro</span>
                <small>${MIN_POR_Q} minutos por questão, com entrega automática quando o tempo acaba. Desligado, o tempo só é contado.</small>
              </label>
            </div>
          <//>
        </aside>
      </div>

      <div className="rodape">
        <span>Questões e comentários dos PDFs Prova_COSIF_FGV_BACEN_1 a 5, elaborados a partir do ManualCompleto.pdf. Notas salvas apenas neste navegador.</span>
        ${Object.keys(st.historico).length > 0 && html`<${Button} type="link" size="small" onClick=${limparHistorico}>Limpar histórico<//>`}
      </div>
    </main>
  </div>`;
}

function ProvaView({ st, up, upS, desktop, pedirEntrega, tempoEsgotado }) {
  const s = st.sessao;
  const [gaveta, setGaveta] = useState(false);
  const total = s.questoes.length;
  const q = s.questoes[s.atual];
  const respondidas = Object.keys(s.respostas).length;
  const marcadas = Object.values(s.marcadas).filter(Boolean).length;
  const ir = (i) => { upS({ atual: Math.max(0, Math.min(total - 1, i)) }); setGaveta(false); };
  const confirmar = () => upS(x => {
    const id = x.questoes[x.atual].id;
    return x.respostas[id] ? { confirmadas: { ...(x.confirmadas || {}), [id]: true } } : {};
  });
  const pendente = !!(s.imediata && s.respostas[q.id] && !confirmada(s, q.id));

  useEffect(() => { window.scrollTo({ top: 0 }); }, [s.atual]);
  useEffect(() => {
    const onKey = (e) => {
      if (e.target.closest && e.target.closest("input, textarea, .ant-select, .ant-modal, .ant-drawer")) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key.toUpperCase();
      if (e.key === "ArrowRight") { ir(s.atual + 1); return; }
      if (e.key === "ArrowLeft") { ir(s.atual - 1); return; }
      if (e.key === "Enter") {
        if (e.target.closest && e.target.closest("button, [role=radio], a")) return;
        if (s.imediata) { e.preventDefault(); confirmar(); }
        return;
      }
      if (k === "M") { upS(x => ({ marcadas: { ...x.marcadas, [q.id]: !x.marcadas[q.id] } })); return; }
      if (LETRAS.includes(k) && k.length === 1) {
        upS(x => { if (confirmada(x, q.id)) return {}; const r = { ...x.respostas }; if (r[q.id] === k) delete r[q.id]; else r[q.id] = k; return { respostas: r }; });
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [s.atual, q]);

  const confirmadasQ = s.imediata ? s.questoes.filter(x => confirmada(s, x.id)) : [];
  const acertos = confirmadasQ.filter(x => s.respostas[x.id] === x.gabarito).length;
  const resumo = s.imediata
    ? html`<div className="resumo">
        <div><b className="ok">${acertos}</b><small>acertos</small></div>
        <div><b className="bad">${confirmadasQ.length - acertos}</b><small>erros</small></div>
        <div><b>${total - confirmadasQ.length}</b><small>a responder</small></div>
      </div>`
    : html`<div className="resumo">
        <div><b>${respondidas}</b><small>respondidas</small></div>
        <div><b>${total - respondidas}</b><small>em branco</small></div>
        <div><b>${marcadas}</b><small>para revisar</small></div>
      </div>`;

  return html`<div>
    <header className="appbar">
      <div className="wrap appbar-in">
        <div style=${{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
          <${Tooltip} title="Voltar à escolha de provas (o progresso fica salvo)">
            <${Button} aria-label="Voltar à escolha de provas" icon=${html`<${ArrowLeftOutlined} />`} onClick=${() => up({ tela: "selecao" })} />
          <//>
          <div className="appbar-title">
            <span className="eyebrow">Simulado COSIF</span>
            <strong>${s.titulo}</strong>
          </div>
        </div>
        <div className="appbar-right">
          <${Timer} s=${s} onEnd=${tempoEsgotado} />
          ${desktop && html`<${TemaBtn} />`}
          ${!desktop && html`<${Button} aria-label="Abrir cartão-resposta" icon=${html`<${AppstoreOutlined} />`} onClick=${() => setGaveta(true)} />`}
          <${Button} type="primary" icon=${html`<${SendOutlined} />`} onClick=${pedirEntrega}>${desktop ? "Entregar bloco" : "Entregar"}<//>
        </div>
      </div>
      <div className="barra" aria-hidden="true"><i style=${{ width: (respondidas / total) * 100 + "%" }}></i></div>
    </header>

    <main className=${"wrap prova-grid" + (desktop ? "" : " mobile")}>
      <section style=${{ minWidth: 0 }}>
        <${Card} styles=${{ body: { padding: desktop ? 28 : 16 } }}>
          <${Questao} key=${q.id} q=${q} idx=${s.atual} s=${s} upS=${upS} confirmar=${confirmar} />
          ${desktop && html`<div className="q-nav">
            <${Button} size="large" icon=${html`<${LeftOutlined} />`} disabled=${s.atual === 0} onClick=${() => ir(s.atual - 1)}>Anterior<//>
            ${s.atual < total - 1
              ? html`<${Button} size="large" type="primary" ghost onClick=${() => ir(s.atual + 1)}>Próxima <${RightOutlined} /><//>`
              : html`<${Button} size="large" type="primary" icon=${html`<${SendOutlined} />`} onClick=${pedirEntrega}>Entregar bloco<//>`}
          </div>`}
        <//>
      </section>
      ${desktop && html`<aside className="side">
        <${Card} size="small" title="Cartão-resposta"><${Cartao} s=${s} onIr=${ir} /><//>
        <${Card} size="small">${resumo}<//>
        <div className="atalhos">Atalhos: <kbd>←</kbd> <kbd>→</kbd> navegar · <kbd>A</kbd>–<kbd>E</kbd> ${s.imediata ? "selecionar" : "responder"}${s.imediata && html`<${React.Fragment}> · <kbd>Enter</kbd> confirmar<//>`} · <kbd>M</kbd> marcar</div>
      </aside>`}
    </main>

    ${!desktop && html`<nav className="bottombar" aria-label="Navegação entre questões">
      <${Button} size="large" icon=${html`<${LeftOutlined} />`} disabled=${s.atual === 0} onClick=${() => ir(s.atual - 1)}>Anterior<//>
      <span className="meio">${s.atual + 1} / ${total}</span>
      ${pendente
        ? html`<${Button} size="large" type="primary" icon=${html`<${CheckOutlined} />`} onClick=${confirmar}>Confirmar<//>`
        : s.atual < total - 1
        ? html`<${Button} size="large" type="primary" ghost onClick=${() => ir(s.atual + 1)}>Próxima <${RightOutlined} /><//>`
        : html`<${Button} size="large" type="primary" onClick=${pedirEntrega}>Entregar<//>`}
    </nav>`}

    <${Drawer} title="Cartão-resposta" placement="bottom" height="auto" open=${gaveta} onClose=${() => setGaveta(false)}
      extra=${html`<${TemaBtn} />`}
      styles=${{ body: { paddingBottom: "calc(24px + env(safe-area-inset-bottom, 0px))" } }}>
      <div style=${{ display: "grid", gap: 18, maxWidth: 520, margin: "0 auto" }}>
        <${Cartao} s=${s} onIr=${ir} />
        ${resumo}
      </div>
    <//>
  </div>`;
}

function ResultadoView({ st, up, desktop, iniciar }) {
  const s = st.sessao;
  const r = useMemo(() => corrigir(s), [s]);
  const [filtro, setFiltro] = useState(r.er + r.br > 0 ? "revisar" : "todas");
  const tempo = s.entregueEm - s.inicioEm;
  const tempoTotal = s.fimEm ? s.fimEm - s.inicioEm : null;
  const lista = s.questoes.map((q, i) => ({ q, i })).filter(({ q }) =>
    filtro === "todas" ? true : filtro === "revisar" ? r.status[q.id] !== "certa" : r.status[q.id] === "certa");
  const irPara = (i) => {
    setFiltro("todas");
    setTimeout(() => { const el = document.getElementById("g-" + s.questoes[i].id); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 60);
  };
  const corPct = r.pct >= 70 ? "var(--ok)" : r.pct >= 50 ? "var(--warn)" : "var(--bad)";
  const statusTag = { certa: html`<${Tag} color="success" bordered=${false}>Acertou<//>`, errada: html`<${Tag} color="error" bordered=${false}>Errou<//>`, branco: html`<${Tag} bordered=${false}>Em branco<//>` };
  const prova = s.tipo === "bloco" ? PROVAS.find(p => p.id === s.prova) : null;
  const temProximo = prova && s.bloco < nBlocos(prova);

  const refazer = async () => {
    if (s.tipo === "bloco") iniciar({ ...s, questoes: s.questoes });
    else {
      try {
        const listas = await Promise.all(s.filtros.provas.map(carregarProva));
        let todas = listas.flat(); if (s.filtros.temas.length) todas = todas.filter(q => s.filtros.temas.includes(q.tema));
        iniciar({ chave: "aleatorio", tipo: "aleatorio", titulo: "Simulado aleatório", filtros: s.filtros, questoes: embaralhar(todas).slice(0, s.filtros.qtd) });
      } catch (e) { antd.message.error("Não foi possível carregar as provas. Verifique a conexão e tente de novo."); }
    }
  };
  const proximo = async () => {
    const b = s.bloco + 1, ini = (b - 1) * TAM_BLOCO, fim = Math.min(b * TAM_BLOCO, prova.total);
    try {
      const qs = await carregarProva(prova.id);
      iniciar({ chave: `p${prova.id}-b${b}`, tipo: "bloco", prova: prova.id, bloco: b, titulo: `Prova ${prova.id} · Bloco ${b}`, questoes: qs.slice(ini, fim) });
    } catch (e) { antd.message.error(`Não foi possível carregar a Prova ${prova.id}. Verifique a conexão e tente de novo.`); }
  };

  const acoes = html`<div className="res-acoes">
    ${temProximo && html`<${Button} type="primary" size="large" icon=${html`<${ArrowRightOutlined} />`} iconPosition="end" onClick=${proximo}>Próximo bloco<//>`}
    <${Button} size="large" type=${temProximo ? "default" : "primary"} icon=${html`<${ReloadOutlined} />`} onClick=${refazer}>${s.tipo === "bloco" ? "Refazer este bloco" : "Novo sorteio"}<//>
    <${Button} size="large" icon=${html`<${AppstoreOutlined} />`} onClick=${() => up({ tela: "selecao" })}>Escolher outra prova<//>
  </div>`;

  return html`<div>
    <${AppBar} eyebrow="Resultado" titulo=${s.titulo}>
      <${Button} aria-label="Voltar à escolha de provas" icon=${html`<${ArrowLeftOutlined} />`} onClick=${() => up({ tela: "selecao" })}>${desktop ? "Provas" : null}<//>
      <${TemaBtn} />
    <//>
    <main className="wrap resultado">
      <${Card} styles=${{ body: { padding: desktop ? 28 : 16 } }}>
        <div className="placar">
          <${Progress} type="dashboard" percent=${r.pct} size=${desktop ? 150 : 124} strokeColor=${corPct}
            format=${p => html`<div style=${{ display: "grid", gap: 2 }}><span style=${{ fontFamily: "var(--font-num)", fontWeight: 600, color: "var(--ink)" }}>${p}%</span><span style=${{ fontSize: 12, color: "var(--muted)" }}>de acertos</span></div>`} />
          <div className="info">
            <div>
              <span className="eyebrow">Bloco entregue</span>
              <h1>${s.titulo}</h1>
              <span style=${{ color: "var(--muted)" }}>Tempo: ${fmt(tempo)}${tempoTotal ? " de " + fmt(tempoTotal) : ""}${s.tipo === "bloco" ? ` · questões ${s.questoes[0].n} a ${s.questoes[s.questoes.length - 1].n}` : ""}</span>
            </div>
            <div className="stats">
              <div className="stat ok"><small>Acertos</small><b>${r.ac}</b></div>
              <div className="stat bad"><small>Erros</small><b>${r.er}</b></div>
              <div className="stat"><small>Em branco</small><b>${r.br}</b></div>
              <div className="stat"><small>Nota</small><b>${r.ac}/${r.total}</b></div>
            </div>
            ${acoes}
          </div>
        </div>
      <//>

      <div className="duas">
        <${Card} title="Temas para revisar" size="small">
          ${r.temasErro.length === 0
            ? html`<${Empty} image=${Empty.PRESENTED_IMAGE_SIMPLE} description="Você acertou todas. Nenhum tema para revisar." />`
            : r.temasErro.map(([t, n]) => html`<div className="tema-linha" key=${t}><span>${t}</span><span>${n} ${n === 1 ? "questão" : "questões"}</span></div>`)}
        <//>
        <${Card} title="Seu cartão-resposta" size="small"><${Cartao} s=${s} onIr=${irPara} status=${r.status} /><//>
      </div>

      <div className="gab-head">
        <h2 className="h2">Gabarito comentado</h2>
        <${Segmented} value=${filtro} onChange=${setFiltro} options=${[
          { label: "Para revisar (" + (r.er + r.br) + ")", value: "revisar" },
          { label: "Acertos (" + r.ac + ")", value: "certas" },
          { label: "Todas (" + r.total + ")", value: "todas" }
        ]} />
      </div>

      <div className="gab-lista">
        ${lista.length === 0 && html`<${Card}><${Empty} description="Nenhuma questão neste filtro." /><//>`}
        ${lista.map(({ q, i }) => {
          const resp = s.respostas[q.id];
          return html`<${Card} key=${q.id} id=${"g-" + q.id} className="gab-item" styles=${{ body: { padding: desktop ? 24 : 16 } }}>
            <div className="q">
              <div className="q-head">
                <div><span className="q-num">Questão ${i + 1}</span></div>
                <div className="q-tags">${statusTag[r.status[q.id]]}<${Origem} q=${q} /></div>
              </div>
              <div className="q-tags"><${Tag}>${q.tema}<//></div>
              <p className="enunciado">${q.enunciado}</p>
              ${q.tipo === "vf" && html`<ol className="itens">${q.itens.map((t, k) => html`<li key=${k}><div className="item-txt"><span className="item-n">${k + 1}</span><span>${t}</span></div></li>`)}</ol>`}
              <div className="alts">
                ${opcoes(q).map(o => {
                  const ehGab = o.k === q.gabarito, ehResp = o.k === resp;
                  const rev = ehGab ? "correta" : ehResp ? "errada" : "";
                  const marca = ehResp ? "Sua resposta" : ehGab ? "Gabarito" : "";
                  return html`<${Alt} key=${o.k} o=${o} seq=${q.tipo === "vf"} rev=${rev} marca=${marca} />`;
                })}
              </div>
              <div className="coment"><b>Comentário · gabarito ${q.gabarito}</b><${Comentario} texto=${q.comentario} /></div>
            </div>
          <//>`;
        })}
      </div>
      ${acoes}
    </main>
  </div>`;
}

/* ---------- App ---------- */
const BLANK = { tela: "boasvindas", sessao: null, historico: {}, ultimaProva: 1, cronometro: true, correcaoImediata: true, filtros: null };

function Main() {
  const screens = Grid.useBreakpoint();
  const desktop = !!screens.lg;
  const { modal, message } = AntApp.useApp();
  const [st, setSt] = useState(() => {
    const salvo = { ...BLANK, ...(carregar() || {}), tela: "boasvindas" };
    const s = salvo.sessao;
    if (s && s.imediata && !s.confirmadas) {
      /* blocos iniciados antes da dupla confirmação: respostas já dadas contam como confirmadas */
      salvo.sessao = { ...s, confirmadas: Object.fromEntries(Object.keys(s.respostas || {}).map(k => [k, true])) };
    }
    return salvo;
  });
  useEffect(() => { const { tela, ...resto } = st; salvar({ ...resto, tela: tela === "boasvindas" ? "selecao" : tela }); }, [st]);
  const up = (patch) => setSt(x => ({ ...x, ...(typeof patch === "function" ? patch(x) : patch) }));
  const upS = (patch) => setSt(x => ({ ...x, sessao: { ...x.sessao, ...(typeof patch === "function" ? patch(x.sessao) : patch) } }));

  useEffect(() => { window.scrollTo({ top: 0 }); }, [st.tela]);

  const entrar = () => {
    const s = st.sessao;
    up({ tela: "selecao" });
  };
  const iniciar = ({ chave, tipo, prova, bloco, titulo, filtros, questoes }) => {
    const agora = Date.now();
    up(x => ({
      tela: "prova",
      sessao: { chave, tipo, prova, bloco, titulo, filtros, questoes, respostas: {}, riscadas: {}, marcadas: {}, vf: {}, confirmadas: {}, atual: 0, imediata: x.correcaoImediata,
        inicioEm: agora, fimEm: x.cronometro ? agora + questoes.length * MIN_POR_Q * 60000 : null, entregueEm: null }
    }));
  };
  const entregar = () => setSt(x => {
    const s = { ...x.sessao, entregueEm: Math.min(Date.now(), x.sessao.fimEm || Infinity) };
    const r = corrigir(s);
    const historico = s.tipo === "bloco" ? { ...x.historico, [s.chave]: { acertos: r.ac, total: r.total, em: Date.now() } } : x.historico;
    return { ...x, sessao: s, historico, tela: "resultado" };
  });
  const tempoEsgotado = () => { message.warning("O tempo acabou. O bloco foi entregue automaticamente.", 5); entregar(); };
  const pedirEntrega = () => {
    const s = st.sessao;
    const resp = Object.keys(s.respostas).length, total = s.questoes.length;
    const marc = Object.values(s.marcadas).filter(Boolean).length;
    const avisos = [];
    if (total - resp > 0) avisos.push((total - resp) + (total - resp === 1 ? " questão em branco" : " questões em branco"));
    if (marc > 0) avisos.push(marc + (marc === 1 ? " marcada para revisão" : " marcadas para revisão"));
    const semConf = s.imediata ? s.questoes.filter(q => s.respostas[q.id] && !confirmada(s, q.id)).length : 0;
    if (semConf > 0) avisos.push(semConf + (semConf === 1 ? " resposta selecionada sem confirmar, que vai contar como respondida" : " respostas selecionadas sem confirmar, que vão contar como respondidas"));
    modal.confirm({
      title: "Entregar o bloco?",
      content: avisos.length ? "Você ainda tem " + avisos.join(" e ") + ". Depois de entregar, não é possível alterar as respostas." : "Todas as questões foram respondidas. Depois de entregar, não é possível alterar as respostas.",
      okText: "Entregar", cancelText: "Continuar respondendo", onOk: entregar
    });
  };

  if (st.tela === "prova" && st.sessao && !st.sessao.entregueEm) return html`<${ProvaView} st=${st} up=${up} upS=${upS} desktop=${desktop} pedirEntrega=${pedirEntrega} tempoEsgotado=${tempoEsgotado} />`;
  if (st.tela === "resultado" && st.sessao && st.sessao.entregueEm) return html`<${ResultadoView} st=${st} up=${up} desktop=${desktop} iniciar=${iniciar} />`;
  if (st.tela === "boasvindas") return html`<${BoasVindas} entrar=${entrar} desktop=${desktop} />`;
  return html`<${Selecao} st=${st} up=${up} iniciar=${iniciar} desktop=${desktop} />`;
}

function Root() {
  const dark = useDark();
  return html`<${ConfigProvider} theme=${{
    algorithm: dark ? theme.darkAlgorithm : theme.defaultAlgorithm,
    token: {
      colorPrimary: dark ? "#5576e6" : "#2448a5",
      colorBgContainer: dark ? "#161b26" : "#ffffff",
      colorBgElevated: dark ? "#1c2230" : "#ffffff",
      colorBorderSecondary: dark ? "#293041" : "#dce1ea",
      colorBorder: dark ? "#353d50" : "#cdd3df",
      borderRadius: 8,
      fontFamily: "'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif",
      fontSize: 15
    }
  }}>
    <${AntApp}><${Main} /><//>
  <//>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${Root} />`);
</script>

</body>
